model_name_or_path: Qwen/Qwen2.5-Coder-7B-Instruct
train_file: data/processed_prompt_v2/train.jsonl
validation_file: data/processed_prompt_v2/valid.jsonl
output_dir: artifacts/adapters/qwen25-coder-7b-spider-qlora

max_seq_length: 2048
num_train_epochs: 1
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0001
warmup_ratio: 0.03
weight_decay: 0.0
lr_scheduler_type: cosine
logging_steps: 10
eval_steps: 100
save_steps: 100
save_total_limit: 5
seed: 42

use_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
compute_dtype: float16
gradient_checkpointing: true

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

report_to: none
wandb_project: text2sql-spider-qwen25-coder-7b-qlora
